services:
  app:
    build: .
    env_file:
      - .env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      OLLAMA_URL: http://ollama:11434
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 90
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  app-bot2:
    image: chatbot-app
    entrypoint: ["sh", "/var/www/html/docker/php/entrypoint-bot2.sh"]
    command: ["php-fpm"]
    env_file:
      - .env.bot2
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      OLLAMA_URL: http://ollama:11434
      VK_CONFIRMATION_FILE: /var/www/html/.env.bot2
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
    depends_on:
      mysql:
        condition: service_healthy
      ollama:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 9000) ? 0 : 1);'"]
      interval: 5s
      timeout: 3s
      retries: 90
      start_period: 30s

  nginx-bot2:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/bot2.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app-bot2:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-chatbot}
      MYSQL_USER: ${DB_USERNAME:-chatbot}
      MYSQL_PASSWORD: ${DB_PASSWORD:-chatbot}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 30

  ollama:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    volumes:
      - ollama:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s

  ollama-pull:
    image: ollama/ollama:latest
    profiles: ["pull"]
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["ollama", "pull", "${OLLAMA_MODEL:-qwen3:8b}"]
    restart: "no"

  cloudflared-named:
    image: cloudflare/cloudflared:latest
    profiles: ["named"]
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - cloudflared:/home/nonroot/.cloudflared
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      nginx:
        condition: service_started

  tunnel-watch:
    image: alpine:3.20
    profiles: ["named"]
    command: ["sh", "/watch.sh"]
    volumes:
      - ./cloudflared/watch.sh:/watch.sh:ro
      - ./cloudflared/status:/status
      - ./:/project
    depends_on:
      cloudflared-named:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "sh", "-c", "grep -q '^UP' /status/tunnel-status.txt"]
      interval: 20s
      timeout: 5s
      retries: 2
      start_period: 40s

volumes:
  mysql_data:
  vendor:
  ollama:
  cloudflared:
    name: chatbot_cloudflared
    external: true
