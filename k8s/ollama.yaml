# Модель qwen3:8b лежит в томе Compose chatbot_ollama. Второй Ollama не запускать.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  namespace: bots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
        - name: ollama
          image: ollama/ollama:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: OLLAMA_HOST
              value: 0.0.0.0:11434
            - name: OLLAMA_KEEP_ALIVE
              value: 10m
            - name: OLLAMA_NUM_PARALLEL
              value: "1"
            - name: OLLAMA_MAX_LOADED_MODELS
              value: "1"
          ports:
            - containerPort: 11434
          readinessProbe:
            exec:
              command: ["sh", "-c", "OLLAMA_HOST=http://127.0.0.1:11434 ollama list"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 15
          volumeMounts:
            - name: models
              mountPath: /root/.ollama
      volumes:
        - name: models
          hostPath:
            path: /var/lib/docker/volumes/chatbot_ollama/_data
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
  namespace: bots
spec:
  selector:
    app: ollama
  ports:
    - port: 11434
      targetPort: 11434
