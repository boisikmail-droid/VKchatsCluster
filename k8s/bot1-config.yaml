apiVersion: v1
kind: ConfigMap
metadata:
  name: bot1-config
  namespace: bots
data:
  APP_NAME: VKChatbot
  APP_ENV: local
  APP_DEBUG: "true"
  APP_URL: https://bot1.melnikovbot.ru
  APP_TIMEZONE: UTC
  LOG_CHANNEL: stack
  CACHE_DRIVER: file
  QUEUE_CONNECTION: sync
  VK_OWNER_ID: "98954713"
  VK_GROUP_ID: "241844767"
  VK_CONFIRMATION_CODE: "006e3750"
  VK_AUTO_REPLY: "true"
  VK_AUTO_REPLY_TEXT: "я просто бот на подсосе"
  VK_STALE_REPLY_TEXT: "Дорогой, Филипп Киркоров просто спал и не мог уделить вам внимание."
