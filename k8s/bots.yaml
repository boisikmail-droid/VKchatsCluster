apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot1
  namespace: bots
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bot1
  template:
    metadata:
      labels:
        app: bot1
    spec:
      initContainers:
        - name: public
          image: chatbot-app:latest
          imagePullPolicy: Never
          command: ["sh", "-c", "cp -a /var/www/html/public/. /public/"]
          volumeMounts:
            - name: public
              mountPath: /public
      containers:
        - name: app
          image: chatbot-app:latest
          imagePullPolicy: Never
          command: ["/entrypoint-k8s.sh"]
          args: ["php-fpm"]
          envFrom:
            - configMapRef:
                name: bots-shared
            - configMapRef:
                name: bot1-config
            - secretRef:
                name: bot1-secret
        - name: nginx
          image: nginx:1.27-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
          startupProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 80
            periodSeconds: 20
            failureThreshold: 3
          volumeMounts:
            - name: public
              mountPath: /var/www/html/public
              readOnly: true
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
      volumes:
        - name: public
          emptyDir: {}
        - name: nginx-conf
          configMap:
            name: nginx-conf
---
apiVersion: v1
kind: Service
metadata:
  name: bot1
  namespace: bots
spec:
  selector:
    app: bot1
  ports:
    - port: 80
      targetPort: 80
---
